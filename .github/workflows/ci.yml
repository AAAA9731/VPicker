name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bin: release/VPicker.exe
            artifact: release/VPicker.exe
          - name: macos-arm64
            os: macos-latest
            bin: release/VPicker
            artifact: release/VPicker-macos-arm64.zip
          - name: macos-x64
            os: macos-15-intel
            bin: release/VPicker
            artifact: release/VPicker-macos-x64.zip
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 构建可分发的 ARM64 FFmpeg
        if: matrix.name == 'macos-arm64'
        shell: bash
        run: bash scripts/build-ffmpeg-macos-arm64.sh

      # 没有游戏文件时，依赖游戏数据的测试会自动跳过，只跑纯逻辑测试（ZIP 写入等）
      - run: npm test

      - name: 构建网页
        run: npm run build

      - name: 打包可执行文件
        run: npm run build:exe

      - name: 冒烟测试（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ${{ matrix.bin }} -ArgumentList '--no-open','--port=5199' -WindowStyle Hidden -PassThru -RedirectStandardOutput exe.log
          try {
            $ok = $false
            foreach ($i in 1..20) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing http://localhost:5199/
                if ($r.StatusCode -eq 200 -and $r.Content -match 'VPicker') { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw '网页没有正常返回' }
            $w = Invoke-WebRequest -UseBasicParsing http://localhost:5199/wasm/texture2ddecoder.wasm
            if ($w.StatusCode -ne 200) { throw 'wasm 资源缺失' }
            $video = Invoke-RestMethod http://localhost:5199/__video/capabilities
            if (-not $video.available -or $video.formats.Count -ne 2) { throw '内置 FFmpeg 不可用' }
            Write-Host '冒烟测试通过'
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Content exe.log -ErrorAction SilentlyContinue
          }

      - name: 冒烟测试（macOS）
        if: runner.os == 'macOS'
        run: |
          ./${{ matrix.bin }} --no-open --port=5199 > exe.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 20); do
            sleep 0.5
            if curl -fs http://localhost:5199/ | grep -q VPicker; then ok=1; break; fi
          done
          curl -fs -o /dev/null http://localhost:5199/wasm/texture2ddecoder.wasm || ok=0
          curl -fs http://localhost:5199/__video/capabilities | grep -q '"available":true' || ok=0
          kill $PID 2>/dev/null || true
          cat exe.log
          [ "$ok" = 1 ] || { echo '网页没有正常返回'; exit 1; }
          echo '冒烟测试通过'

      - uses: actions/upload-artifact@v4
        with:
          name: VPicker-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'macos-arm64'
        with:
          name: FFmpeg-macos-arm64-sources
          path: release/FFmpeg-macos-arm64-sources.tar.gz
          retention-days: 14
