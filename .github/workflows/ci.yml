name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 没有游戏文件时，依赖游戏数据的测试会自动跳过，只跑纯逻辑测试（ZIP 写入等）
      - run: npm test

      - name: 构建网页
        run: npm run build

      - name: 打包 exe
        run: npm run build:exe

      - name: exe 冒烟测试
        shell: pwsh
        run: |
          $p = Start-Process -FilePath release/VPicker.exe -ArgumentList '--no-open','--port=5199' -PassThru -RedirectStandardOutput exe.log
          try {
            $ok = $false
            foreach ($i in 1..20) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing http://localhost:5199/
                if ($r.StatusCode -eq 200 -and $r.Content -match 'VPicker') { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw '网页没有正常返回' }
            $w = Invoke-WebRequest -UseBasicParsing http://localhost:5199/wasm/texture2ddecoder.wasm
            if ($w.StatusCode -ne 200) { throw 'wasm 资源缺失' }
            Write-Host 'exe 冒烟测试通过'
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Content exe.log -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: VPicker-windows
          path: release/VPicker.exe
          retention-days: 14
